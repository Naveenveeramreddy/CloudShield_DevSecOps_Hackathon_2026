apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      containers:
        - name: board
          image: <IMAGE>
          ports:
            - containerPort: 8080
